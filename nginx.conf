server {
    listen 80 default_server;
    server_name _;

    # Serve the React frontend statically (Best Practice for Production)
    root /var/www/medpreview/frontend/dist;
    index index.html;

    # Handle React Router SPA (Single Page Application) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy (Port 8400)
    location /api/ {
        proxy_pass http://localhost:8400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static uploads proxy
    location /uploads/ {
        proxy_pass http://localhost:8400/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
